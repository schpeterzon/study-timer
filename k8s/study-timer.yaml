apiVersion: v1
kind: Namespace
metadata:
  name: study-timer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-timer
  namespace: study-timer
  labels:
    app.kubernetes.io/name: study-timer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: study-timer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-timer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: study-timer
          image: ghcr.io/YOUR_USER/study-timer:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: study-timer
  namespace: study-timer
  labels:
    app.kubernetes.io/name: study-timer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: study-timer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
